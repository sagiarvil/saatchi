<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Çevrimdışı | SAATCHI & CO. Lüks Saatler</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .logo {
      font-size: 24px;
      letter-spacing: 0.25em;
      font-weight: 700;
      color: #846b32;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }
    p {
      color: #a3a3a3;
      font-size: 14px;
      line-height: 1.6;
      max-width: 360px;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      min-height: 48px;
      min-width: 160px;
      line-height: 48px;
      padding: 0 24px;
      background: #846b32;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="logo">SAATCHI & CO.</div>
  <h1>İnternet Bağlantısı Yok</h1>
  <p>Şu anda çevrimdışısınız. Bağlantınız yeniden sağlandığında en seçkin lüks saat koleksiyonlarımızı keşfetmeye devam edebilirsiniz.</p>
  <button class="btn" onclick="window.location.reload()">Yeniden Dene</button>
</body>
</html>
