name: Hero Parts 3-5 Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/components/ui/HeroSlider.tsx'
      - 'src/app/globals.css'
      - '.github/scripts/hero-part3-5-verify.sh'
      - '.github/workflows/hero-parts-3-5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify playback and CSS invariants
        run: bash .github/scripts/hero-part3-5-verify.sh

      - name: Lint hero component
        run: npx eslint src/components/ui/HeroSlider.tsx

      - name: Production build
        run: npm run build
