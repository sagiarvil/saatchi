name: Hero Parts 1-2 Media Gate

on:
  push:
    branches: [main]
    paths:
      - 'public/videos/**'
      - 'src/components/ui/HeroSlider.tsx'
      - 'src/app/globals.css'
      - 'postcss.config.mjs'
      - '.github/scripts/hero-part1-verify.sh'
      - '.github/workflows/hero-parts-1-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify hero media and production delivery
        run: bash .github/scripts/hero-part1-verify.sh
