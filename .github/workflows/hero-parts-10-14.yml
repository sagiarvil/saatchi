name: Hero Parts 10-14 Predeploy QA

on:
  push:
    branches: [main]
    paths:
      - 'src/components/ui/HeroSlider.tsx'
      - 'public/videos/**'
      - '.github/scripts/hero-*'
      - '.github/workflows/hero-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hero-predeploy-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HERO_SCOPE_BASE: ${{ github.event.before }}
      HERO_QA_URL: http://127.0.0.1:3000
      HERO_QA_OUT: hero-qa-artifacts
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Enforce hero-only predeploy scope
        run: bash .github/scripts/hero-predeploy-scope.sh

      - name: Run architecture-neutral hero CI guard
        run: bash .github/scripts/hero-ci-guard.sh

      - name: Install synthetic browser QA tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/saatchi-next.log 2>&1 &
          echo $! > /tmp/saatchi-next.pid
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/saatchi-next.log
          exit 1

      - name: Run device viewport and network QA
        run: node .github/scripts/hero-mobile-qa.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-mobile-qa-evidence
          if-no-files-found: warn
          path: |
            hero-qa-artifacts/**
            /tmp/saatchi-next.log

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/saatchi-next.pid ]; then
            kill "$(cat /tmp/saatchi-next.pid)" 2>/dev/null || true
          fi
