name: Hero Parts 6-9 Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/components/ui/HeroSlider.tsx'
      - 'public/videos/**'
      - '.github/scripts/hero-part6-9-verify.sh'
      - '.github/workflows/hero-parts-6-9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify fallback lifecycle priority and error invariants
        run: bash .github/scripts/hero-part6-9-verify.sh

      - name: Lint hero component
        run: npx eslint src/components/ui/HeroSlider.tsx

      - name: Production build
        run: npm run build
