name: Hero Video Mobile Normalization

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hero-video-normalize-main
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize and verify hero videos
        shell: bash
        run: bash .github/scripts/hero-video-normalize.sh

      - name: Commit normalized hero videos only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/videos/hero1.mp4 public/videos/hero2.mp4 public/videos/hero3.mp4

          if git diff --cached --quiet; then
            echo "No hero video changes to commit."
            exit 0
          fi

          unexpected="$(git diff --cached --name-only | grep -Ev '^public/videos/hero[123]\.mp4$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected staged files:"
            echo "$unexpected"
            exit 1
          fi

          git commit -m "fix: standardize hero videos for mobile playback"
          git pull --rebase origin main
          git push origin HEAD:main
