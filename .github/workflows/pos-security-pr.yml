name: Saatchi POS Security PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/api/payment/**'
      - 'src/app/api/vip-link/**'
      - 'src/app/api/admin/**'
      - 'src/app/admin/viplink/**'
      - 'src/app/vip-checkout/**'
      - 'src/lib/payment-boundary.ts'
      - 'src/lib/vip-*.ts'
      - 'scripts/check-vip-security.mjs'
      - 'scripts/test-vip-behavior.mjs'
      - 'firebase.json'
      - 'docs/POS_SECURITY_HANDOFF.md'
      - 'public/admin.html'
      - 'public/js/admin.js'
      - 'public/js/vip-payment.js'
      - '.github/workflows/pos-security-pr.yml'

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dependency audit (high/critical gate)
        run: npm audit --audit-level=high
      - name: Production dependency audit (moderate+ gate)
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run check:vip
      - run: npm run test:vip
      - name: Legacy admin syntax check
        run: node --check public/js/admin.js
      - name: Lint changed POS surface
        run: npx eslint src/app/api/payment/route.ts src/app/api/vip-link/route.ts src/app/api/admin/vip-links/route.ts src/app/api/admin/vip-payment-reconcile/route.ts src/app/vip-checkout/page.tsx src/lib/payment-boundary.ts src/lib/vip-link-store.ts src/lib/vip-input.ts
      - run: npm run build
