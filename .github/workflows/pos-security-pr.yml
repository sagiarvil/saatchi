name: Saatchi POS Security PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/api/payment/**'
      - 'src/app/api/vip-link/**'
      - 'src/app/api/admin/**'
      - 'src/app/admin/viplink/**'
      - 'src/app/vip-checkout/**'
      - 'src/lib/payment-boundary.ts'
      - 'src/lib/vip-*.ts'
      - 'scripts/check-vip-security.mjs'
      - 'scripts/test-vip-behavior.mjs'
      - 'firebase.json'
      - '.github/workflows/pos-security-pr.yml'

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:vip
      - run: npm run test:vip
      - run: npm run lint
      - run: npm run build
