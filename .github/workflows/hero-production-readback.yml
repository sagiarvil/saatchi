name: Hero Production Readback

on:
  push:
    branches: [main]
    paths:
      - 'src/components/ui/HeroSlider.tsx'
      - 'src/app/globals.css'
      - 'public/videos/hero1.mp4'
      - 'public/videos/hero2.mp4'
      - 'public/videos/hero3.mp4'
      - 'postcss.config.mjs'
      - '.github/scripts/hero-production-readback.sh'
      - '.github/workflows/hero-production-readback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Report Firebase deploy credential readiness
        env:
          FIREBASE_SA_PROJECT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STUDIO_7658156126_FFB8E }}
          FIREBASE_SA_GENERIC: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN_VALUE: ${{ secrets.FIREBASE_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$FIREBASE_SA_PROJECT" ] || [ -n "$FIREBASE_SA_GENERIC" ] || [ -n "$FIREBASE_TOKEN_VALUE" ] || [ -n "$GCP_SA_KEY" ]; then
            echo 'FIREBASE_DEPLOY_AUTH=AVAILABLE'
          else
            echo 'FIREBASE_DEPLOY_AUTH=NOT_CONFIGURED'
          fi
      - name: Verify production equals repository
        env:
          HERO_PRODUCTION_URL: https://saatchi.watch
        run: bash .github/scripts/hero-production-readback.sh
