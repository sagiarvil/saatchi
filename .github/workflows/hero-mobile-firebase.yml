name: Hero Mobile Firebase Gate
# Architecture-neutral hero regression gate.

on:
  push:
    branches: [main]
    paths:
      - 'src/components/ui/HeroSlider.tsx'
      - 'public/videos/**'
      - '.github/scripts/hero-part1-verify.sh'
      - '.github/workflows/hero-mobile-firebase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PART 1 hero verification
        run: bash .github/scripts/hero-part1-verify.sh
