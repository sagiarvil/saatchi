name: Hero CI Guard
# Hero-only regression gate. It deliberately does not validate Firebase,
# Cloudflare, SSR/static-export choices, API architecture, or deployment model.

on:
  push:
    branches: [main]
    paths:
      - 'src/components/ui/HeroSlider.tsx'
      - 'public/videos/**'
      - '.github/scripts/hero-ci-guard.sh'
      - '.github/workflows/hero-mobile-firebase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run architecture-neutral hero guard
        run: bash .github/scripts/hero-ci-guard.sh
