name: Hero Mobile Firebase Gate

on:
  push:
    branches: [main]
    paths:
      - 'src/components/ui/HeroSlider.tsx'
      - 'public/videos/**'
      - '.github/workflows/hero-mobile-firebase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify hero media assets
        shell: bash
        run: |
          set -euo pipefail
          for file in public/videos/hero1.mp4 public/videos/hero2.mp4 public/videos/hero3.mp4; do
            test -s "$file" || { echo "Missing or empty hero asset: $file"; exit 1; }
          done

      - name: Lint mobile hero
        run: npx eslint src/components/ui/HeroSlider.tsx

      - name: Production build
        run: npm run build
