name: Hero Mobile Release

on:
  push:
    branches:
      - main
    paths:
      - src/components/ui/HeroSlider.tsx
      - public/videos/**
      - .github/workflows/hero-mobile-release.yml

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint hero release surface
        run: npx eslint src/components/ui/HeroSlider.tsx

      - name: Build
        run: npm run build

      - name: Inspect hero video mobile compatibility
        shell: bash
        run: |
          set -euo pipefail
          for file in public/videos/hero*.mp4; do
            echo "=== $file ==="
            ffprobe -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name,profile,pix_fmt,width,height,level,r_frame_rate \
              -of default=noprint_wrappers=1 "$file"
            echo
          done

      - name: Probe current production media delivery
        shell: bash
        run: |
          set -euo pipefail
          echo "=== homepage ==="
          curl -sSIL --max-time 20 https://saatchi.watch/ | sed -n '1,30p'
          echo "=== hero1 full headers ==="
          curl -sSIL --max-time 20 https://saatchi.watch/videos/hero1.mp4 | sed -n '1,40p'
          echo "=== hero1 range request ==="
          curl -sS -D - -o /dev/null --max-time 20 -H 'Range: bytes=0-1023' https://saatchi.watch/videos/hero1.mp4 | sed -n '1,40p'

      - name: Verify Cloudflare release credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }

      - name: Deploy saatchi.watch
        run: npm run deploy
