name: Saatchi Main Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saatchi-main-regression
  cancel-in-progress: true

jobs:
  verify-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high/critical gate)
        run: npm audit --audit-level=high

      - name: Production dependency audit (moderate+ gate)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Legacy admin syntax check
        run: node --check public/js/admin.js

      - name: Install pricing test dependencies
        run: python3 -m pip install -q curl_cffi beautifulsoup4

      - name: Python syntax guards
        run: python3 -m py_compile scripts/update_prices.py scripts/update_prices_resilient.py scripts/test-pricing-engine.py scripts/sync-konyali-brand-safe.py scripts/fix-carren-catalog.py

      - name: Pricing unit regression test
        run: python3 scripts/test-pricing-engine.py

      - name: Release shell syntax guard
        run: bash -n scripts/publish-saatchi-catalog.sh

      - name: Hero autoplay guard
        run: npm run check:hero

      - name: Premium UI guard
        run: npm run check:premium-ui

      - name: VIP static security guard
        run: npm run check:vip

      - name: VIP behavioral security tests
        run: npm run test:vip

      - name: Targeted production/security ESLint
        run: >
          npx eslint
          src/app/api/payment/route.ts
          src/app/api/vip-link/route.ts
          src/app/api/vip-link/verify/route.ts
          src/app/api/admin-session/route.ts
          src/app/api/admin/vip-links/route.ts
          src/app/api/admin/vip-payment-reconcile/route.ts
          src/app/admin/viplink/page.tsx
          src/app/vip-checkout/page.tsx
          src/app/odeme/page.tsx
          src/components/layout/Footer.tsx
          src/lib/payment-*.ts
          src/lib/vip-*.ts
          src/lib/security-audit-log.ts

      - name: Production build
        run: npm run build

      - name: Built POS runtime smoke
        run: node scripts/smoke-pos-runtime.mjs
