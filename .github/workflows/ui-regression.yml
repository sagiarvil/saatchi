name: Saatchi Main Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saatchi-main-regression
  cancel-in-progress: true

jobs:
  verify-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Python syntax guards
        run: python3 -m py_compile scripts/update_prices.py scripts/sync-konyali-brand-safe.py scripts/fix-carren-catalog.py

      - name: Hero autoplay guard
        run: npm run check:hero

      - name: Premium UI guard
        run: npm run check:premium-ui

      - name: Production build
        run: npm run build
