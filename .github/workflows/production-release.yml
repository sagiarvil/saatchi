name: Saatchi Production Release

on:
  workflow_run:
    workflows: ["Saatchi Main Regression"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: saatchi-production-release
  cancel-in-progress: false

jobs:
  deploy-production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: studio-7658156126-ffb8e
      HOSTING_TARGET: saatchi
      SITE_URL: https://saatchi.watch
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STUDIO_7658156126_FFB8E || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Resolve exact release SHA
        id: release
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Prove release SHA belongs to current main
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$RELEASE_SHA" = "$MAIN_SHA" || {
            echo "RELEASE_SHA_NOT_CURRENT_MAIN release=$RELEASE_SHA main=$MAIN_SHA" >&2
            exit 1
          }
          echo "RELEASE_SHA_IS_CURRENT_MAIN=$RELEASE_SHA"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Verify release target and credential presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || {
            echo 'FIREBASE_DEPLOY_AUTH_MISSING: add FIREBASE_SERVICE_ACCOUNT_STUDIO_7658156126_FFB8E or FIREBASE_SERVICE_ACCOUNT as a GitHub Actions secret.' >&2
            exit 2
          }
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          rc=json.loads(Path('.firebaserc').read_text(encoding='utf-8'))
          fb=json.loads(Path('firebase.json').read_text(encoding='utf-8'))
          project=rc.get('projects',{}).get('default')
          targets=rc.get('targets',{}).get(project,{}).get('hosting',{}).get('saatchi',[])
          site=fb.get('hosting',{}).get('site')
          region=fb.get('hosting',{}).get('frameworksBackend',{}).get('region')
          if project!='studio-7658156126-ffb8e' or site!='saatchi' or 'saatchi' not in targets or region!='us-central1':
              print('FIREBASE_TARGET_INVALID',project,site,targets,region)
              sys.exit(1)
          print('FIREBASE_TARGET_OK project=studio-7658156126-ffb8e site=saatchi region=us-central1')
          PY
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          chmod 600 "$RUNNER_TEMP/firebase-sa.json"
          python3 - "$RUNNER_TEMP/firebase-sa.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('type')=='service_account', 'credential is not a service-account JSON object'
          assert d.get('project_id')=='studio-7658156126-ffb8e', f"credential project mismatch: {d.get('project_id')}"
          print('FIREBASE_CREDENTIAL_PROJECT_OK')
          PY

      - name: Capture previous live revision
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          previous=''
          if curl -fsS --connect-timeout 8 --max-time 15 "$SITE_URL/build-info.json" -o "$RUNNER_TEMP/previous.json" 2>/dev/null; then
            previous="$(python3 - "$RUNNER_TEMP/previous.json" <<'PY'
          import json,sys,re
          try: value=str(json.load(open(sys.argv[1])).get('gitSha') or '')
          except Exception: value=''
          print(value if re.fullmatch(r'[0-9a-fA-F]{40}',value) else '')
          PY
          )"
          fi
          echo "sha=$previous" >> "$GITHUB_OUTPUT"
          echo "PREVIOUS_LIVE_SHA=${previous:-UNKNOWN}"

      - name: Install dependencies
        run: npm ci

      - name: Snapshot current Firebase live release for rollback
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          set -euo pipefail
          ./node_modules/.bin/firebase hosting:clone "$HOSTING_TARGET:live" "$HOSTING_TARGET:predeploy-rollback" --project "$PROJECT_ID" --non-interactive
          echo "ROLLBACK_SNAPSHOT_VERIFIED=$HOSTING_TARGET:predeploy-rollback"

      - name: Build exact verified commit
        env:
          GITHUB_SHA: ${{ steps.release.outputs.sha }}
        run: npm run build

      - name: Prove build identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - "$EXPECTED_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path('public/build-info.json').read_text(encoding='utf-8'))
          assert d.get('gitSha')==sys.argv[1], (d,sys.argv[1])
          print('BUILD_ID_OK',sys.argv[1])
          PY

      - name: Deploy exact commit to Firebase production
        id: deploy
        continue-on-error: true
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          set -euo pipefail
          ./node_modules/.bin/firebase deploy --only "hosting:$HOSTING_TARGET" --project "$PROJECT_ID" --non-interactive

      - name: Runtime readback and public security smoke
        id: runtime
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 18); do
            if curl -fsS --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/build-info.json?attempt=$attempt" -o "$RUNNER_TEMP/live.json" 2>/dev/null; then
              if python3 - "$RUNNER_TEMP/live.json" "$EXPECTED_SHA" <<'PY'
          import json,sys
          try: d=json.load(open(sys.argv[1]))
          except Exception: raise SystemExit(1)
          raise SystemExit(0 if d.get('gitSha')==sys.argv[2] else 1)
          PY
              then ok=1; break; fi
            fi
            sleep 10
          done
          test "$ok" = 1
          echo "LIVE_DEPLOY_SHA_OK=$EXPECTED_SHA"

          request() {
            local name="$1" method="$2" url="$3" expected="$4" body="${5:-}"
            local args=(-sS -X "$method" --connect-timeout 10 --max-time 25 -o "$RUNNER_TEMP/$name.json" -w '%{http_code}')
            if [ -n "$body" ]; then
              args+=(-H 'Content-Type: application/json' -H 'Origin: https://saatchi.watch' --data "$body")
            fi
            local status
            status="$(curl "${args[@]}" "$url")"
            echo "$name HTTP=$status"
            test "$status" = "$expected"
          }

          request session GET "$SITE_URL/api/admin-session" 200
          python3 - "$RUNNER_TEMP/session.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('success') is True and d.get('authenticated') is False, d
          PY
          request admin_list GET "$SITE_URL/api/admin/vip-links" 401
          request invalid_token POST "$SITE_URL/api/vip-link/verify" 400 '{"token":"invalid"}'
          request wrong_login POST "$SITE_URL/api/admin-session" 401 '{"key":"definitely-wrong-runtime-smoke-key"}'
          request unauth_create POST "$SITE_URL/api/vip-link" 401 '{"title":"Runtime Smoke","amount":123456}'
          echo 'SAATCHI_LIVE_PUBLIC_RUNTIME_SMOKE_OK'

      - name: Roll back automatically if post-deploy verification fails
        if: steps.deploy.outcome != 'success' || steps.runtime.outcome != 'success'
        shell: bash
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: |
          set -euo pipefail
          echo "ROLLBACK_START snapshot=$HOSTING_TARGET:predeploy-rollback previous_sha=${PREVIOUS_SHA:-UNKNOWN}"
          ./node_modules/.bin/firebase hosting:clone "$HOSTING_TARGET:predeploy-rollback" "$HOSTING_TARGET:live" --project "$PROJECT_ID" --non-interactive
          if [ -n "$PREVIOUS_SHA" ]; then
            ok=0
            for attempt in $(seq 1 18); do
              if curl -fsS --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/build-info.json?rollback=$attempt" -o "$RUNNER_TEMP/rollback.json" 2>/dev/null; then
                if python3 - "$RUNNER_TEMP/rollback.json" "$PREVIOUS_SHA" <<'PY'
          import json,sys
          try: d=json.load(open(sys.argv[1]))
          except Exception: raise SystemExit(1)
          raise SystemExit(0 if d.get('gitSha')==sys.argv[2] else 1)
          PY
                then ok=1; break; fi
              fi
              sleep 10
            done
            test "$ok" = 1
            echo "ROLLBACK_VERIFIED_SHA=$PREVIOUS_SHA"
          else
            echo "ROLLBACK_VERIFIED_BY_FIREBASE_SNAPSHOT"
          fi

      - name: Enforce verified production result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_SHA=${{ steps.release.outputs.sha }}"
          echo "PREVIOUS_LIVE_SHA=${{ steps.previous.outputs.sha || 'UNKNOWN' }}"
          echo "DEPLOY_OUTCOME=${{ steps.deploy.outcome }}"
          echo "RUNTIME_OUTCOME=${{ steps.runtime.outcome }}"
          if [ "${{ steps.deploy.outcome }}" != "success" ] || [ "${{ steps.runtime.outcome }}" != "success" ]; then
            echo 'PRODUCTION_RELEASE_NOT_VERIFIED' >&2
            exit 1
          fi
          echo 'SAATCHI_PRODUCTION_RELEASE_VERIFIED'
