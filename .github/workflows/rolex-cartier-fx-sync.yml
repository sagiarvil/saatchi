name: Rolex Cartier Live Source Sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/rolex-cartier-source-map.json'
      - 'scripts/update_prices.py'
      - 'scripts/update_prices_resilient.py'
      - '.github/workflows/rolex-cartier-fx-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saatchi-pricing-sync
  cancel-in-progress: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate 31 real source mappings
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          rows=json.loads(Path('scripts/rolex-cartier-source-map.json').read_text(encoding='utf-8'))
          ids=[str(x.get('id') or '') for x in rows]
          bad=[x for x in rows if x.get('brand') not in {'Rolex','Cartier'} or not str(x.get('reference') or '') or not str(x.get('sourceUrl') or '').startswith('https://www.chrono24.com/') or not str(x.get('identitySourceUrl') or '').startswith('https://')]
          if len(rows)!=31 or len(set(ids))!=31 or bad:
              print('ROLEX_CARTIER_SOURCE_MAP_INVALID', 'count=',len(rows),'unique=',len(set(ids)),'bad=',bad[:3])
              sys.exit(1)
          print('ROLEX_CARTIER_SOURCE_MAP_OK count=31')
          PY

      - name: Install pricing dependencies
        run: python3 -m pip install -q curl_cffi beautifulsoup4

      - name: Python syntax guard
        run: python3 -m py_compile scripts/update_prices.py scripts/update_prices_resilient.py

      - name: Live verify references and update prices
        run: python3 scripts/update_prices_resilient.py

      - name: Require 31 live source readbacks
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          from urllib.parse import urlparse

          items=json.loads(Path('src/data/elit-saatler.json').read_text(encoding='utf-8'))
          report=json.loads(Path('scripts/sync-saatchi-catalog-report.json').read_text(encoding='utf-8'))
          rc=[x for x in items if x.get('brand') in {'Rolex','Cartier'}]

          def valid_source(x):
              url=str(x.get('sourceUrl') or '')
              host=urlparse(url).netloc.lower()
              provider=str(x.get('sourceProvider') or '')
              kind=str(x.get('sourcePriceKind') or '')
              if provider=='Chrono24':
                  return 'chrono24.' in host and kind.startswith('LIVE_LISTING_MEDIAN_')
              if provider=='WatchCharts':
                  return (host=='watchcharts.com' or host.endswith('.watchcharts.com')) and kind=='WATCHCHARTS_MARKET_USD'
              return False

          bad=[x.get('id') for x in rc if x.get('sourcePriceStatus')!='live_source_url' or x.get('fxSource')!='doviz.com' or x.get('fxRateSide')!='sell' or x.get('sourceCurrency') not in {'USD','EUR'} or not valid_source(x) or not x.get('sourceVerifiedAt') or x.get('pricingRule')!='FOREIGN_SOURCE_X_DOVIZ_SELL_X_2_50']
          provider_counts=report.get('rolexCartierSourceProviderCounts') or {}
          if len(rc)!=31 or bad or report.get('rolexCartierLiveSourceVerifiedCount')!=31 or sum(int(v) for v in provider_counts.values())!=31:
              print('ROLEX_CARTIER_LIVE_PRICE_READBACK_FAILED','count=',len(rc),'bad=',bad,'report=',report.get('rolexCartierLiveSourceVerifiedCount'),'providers=',provider_counts)
              sys.exit(1)
          print('ROLEX_CARTIER_LIVE_PRICE_READBACK_OK count=31 providers=',provider_counts)
          PY

      - name: Commit verified price changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/elit-saatler.json src/data/saatler_paytr.json scripts/sync-saatchi-catalog-report.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Rolex Cartier from 31 verified live sources"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Rolex/Cartier live-source data unchanged."
          fi
