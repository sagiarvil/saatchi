name: Rolex Cartier FX Price Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saatchi-pricing-sync
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pricing dependencies
        run: python3 -m pip install -q curl_cffi beautifulsoup4

      - name: Update Rolex and Cartier prices
        run: python3 scripts/update_prices.py

      - name: Commit verified price changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/elit-saatler.json src/data/saatler_paytr.json scripts/sync-saatchi-catalog-report.json
          git diff --cached --quiet || (git commit -m "data: refresh Rolex Cartier prices from Doviz FX" && git push)
