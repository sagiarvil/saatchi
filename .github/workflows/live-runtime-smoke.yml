name: Saatchi Live Runtime Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Saatchi Production Release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: saatchi-live-runtime-smoke
  cancel-in-progress: true

jobs:
  public-runtime:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public VIP runtime boundaries and deployed commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          BASE='https://saatchi.com.tr'
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          request() {
            local name="$1" method="$2" url="$3" expected="$4" body="${5:-}"
            local args=(-sS -X "$method" -D "$TMP/$name.headers" -o "$TMP/$name.body" -w '%{http_code}' --connect-timeout 10 --max-time 25)
            if [ -n "$body" ]; then
              args+=(-H 'Content-Type: application/json' -H 'Origin: https://saatchi.com.tr' --data "$body")
            fi
            local status
            status="$(curl "${args[@]}" "$url")"
            echo "$name HTTP=$status"
            cat "$TMP/$name.body"
            echo
            test "$status" = "$expected"
          }

          request build_info GET "$BASE/build-info.json" 200
          python3 - "$TMP/build_info.body" "$EXPECTED_SHA" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          expected=sys.argv[2]
          assert d.get('gitSha') == expected, {'live':d.get('gitSha'),'expected':expected}
          assert d.get('builtAt'), d
          print('LIVE_DEPLOY_SHA_OK', expected)
          PY

          request session GET "$BASE/api/admin-session" 200
          python3 - "$TMP/session.body" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('success') is True and d.get('authenticated') is False, d
          PY
          grep -Eiq '^cache-control:.*no-store' "$TMP/session.headers"

          request checkout_headers GET "$BASE/vip-checkout?token=invalid" 200
          grep -Eiq '^strict-transport-security:.*max-age=' "$TMP/checkout_headers.headers"
          grep -Eiq '^x-content-type-options:.*nosniff' "$TMP/checkout_headers.headers"
          grep -Eiq '^referrer-policy:.*no-referrer' "$TMP/checkout_headers.headers"
          grep -Eiq '^x-robots-tag:.*noindex' "$TMP/checkout_headers.headers"
          grep -Eiq '^cache-control:.*no-store' "$TMP/checkout_headers.headers"
          grep -Eiq '^content-security-policy:.*frame-src .none.' "$TMP/checkout_headers.headers"

          request admin_list GET "$BASE/api/admin/vip-links" 401
          python3 - "$TMP/admin_list.body" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('success') is False, d
          PY

          request invalid_token POST "$BASE/api/vip-link/verify" 400 '{"token":"invalid"}'
          python3 - "$TMP/invalid_token.body" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get('success') is False, d
          PY

          request wrong_login POST "$BASE/api/admin-session" 401 '{"key":"definitely-wrong-runtime-smoke-key"}'
          request unauth_create POST "$BASE/api/vip-link" 401 '{"title":"Runtime Smoke","amount":123456}'

          echo 'SAATCHI_LIVE_PUBLIC_RUNTIME_SMOKE_OK'
